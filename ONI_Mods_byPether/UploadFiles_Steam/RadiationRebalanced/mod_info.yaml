# requiredDlcIds lists DLC IDs that must be enabled (leave [] to support all content)
# forbiddenDlcIds lists DLC IDs that must be disabled (leave [] unless you need to block a DLC)
requiredDlcIds: [EXPANSION1_ID]
forbiddenDlcIds: []
# The build number of the last version of the game you tested your mod with
minimumSupportedBuild: 512719
# An arbitrary string that will be displayed to users on the mod screen. is prepended with a "v" in the UI
version: "2022.8.3.917"
# Required if your mod includes DLLs to let the game know you've updated to Harmony2.0
APIVersion: 2 
